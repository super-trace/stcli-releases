name: Installers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: bash -n install.sh
      - run: python3 tests/install.py
