name: Bug report
description: stcli crashed, failed to install, or did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before you paste.** Debug logs contain device output: hostnames,
        addresses, configs, and secrets in show output. A command that ran without
        asking is a security issue: [report it privately](https://github.com/super-trace/stcli-releases/security/advisories/new).
  - type: textarea
    id: version
    attributes:
      label: stcli version
      description: Output of `stcli version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, WSL, Windows]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device platform
      options:
        - Junos
        - Cisco IOS-XE
        - Cisco NX-OS
        - Arista EOS
        - Nokia SR Linux
        - Ciena SAOS 10
        - SONiC
        - Linux
        - Other
        - Not device-related
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked or ran, what stcli did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. stcli admin@router
        2. ❯ why is bgp down?
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Run with `--debug` and paste the relevant part of `stcli-debug.log` from the working directory.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed hostnames, addresses, and secrets I don't want public.
          required: true
